services:
  web:
    build: .
    container_name: my-vue-app
    ports:
      - "80:80"
    restart: unless-stopped

  # 后端就绪后，设置 BACKEND_IMAGE 并使用 --profile backend 启动此服务。
  # 后端容器需监听 0.0.0.0:8080。
  backend:
    image: ${BACKEND_IMAGE:-your-backend-image:latest}
    profiles:
      - backend
    expose:
      - "8080"
    restart: unless-stopped